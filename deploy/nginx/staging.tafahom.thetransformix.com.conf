# Product backend (Node/NestJS) — identity, tokens, consultations, JWKS.
#
#   staging.tafahom.thetransformix.com  ->  127.0.0.1:8001
#
# Nothing here streams, so this vhost is ordinary. The one on staging2 is not.
#
# Install:
#   cp deploy/nginx/staging.tafahom.thetransformix.com.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/staging.tafahom.thetransformix.com.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Requires deploy/nginx/00-law-agent-limits.conf in /etc/nginx/conf.d/.

server {
    listen 80;
    listen [::]:80;
    server_name staging.tafahom.thetransformix.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.tafahom.thetransformix.com;

    ssl_certificate     /etc/letsencrypt/live/staging.tafahom.thetransformix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.tafahom.thetransformix.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # This service is an API. Nothing it returns should ever be framed.
    add_header X-Frame-Options "DENY" always;

    # Tokens and payment payloads. Do not let a proxy or browser keep them.
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/law-agent-backend.access.log;
    error_log  /var/log/nginx/law-agent-backend.error.log;

    client_max_body_size 1m;

    # CORS is handled by the application, which knows the allowed origin
    # pattern and must answer OPTIONS itself. Adding Access-Control-* headers
    # here as well would emit them twice, and a duplicated
    # Access-Control-Allow-Origin is rejected by every browser.

    # ── password guessing ────────────────────────────────────────────────
    location = /auth/login {
        limit_req zone=law_agent_login burst=5 nodelay;
        include /etc/nginx/snippets/law-agent-proxy-backend.conf;
    }

    # ── free user-row creation ───────────────────────────────────────────
    location = /auth/anonymous {
        limit_req zone=law_agent_anon burst=10 nodelay;
        include /etc/nginx/snippets/law-agent-proxy-backend.conf;
    }

    location = /auth/signup {
        limit_req zone=law_agent_signup burst=5 nodelay;
        include /etc/nginx/snippets/law-agent-proxy-backend.conf;
    }

    # ── the payment callback ─────────────────────────────────────────────
    # Not rate limited. Paymob retries on failure and throttling a gateway
    # callback loses money rather than protecting anything; the HMAC is what
    # makes this endpoint safe to expose.
    location = /webhooks/paymob {
        include /etc/nginx/snippets/law-agent-proxy-backend.conf;
    }

    # ── service-to-service ───────────────────────────────────────────────
    # Erasure delivery and the escalation-retry cron authenticate with
    # ADMIN_API_KEY. They are called by other services on this host, never by
    # a browser, so they do not need to be reachable from the internet.
    #
    # /admin/billing/* is deliberately NOT here: the dashboard reaches it with
    # a staff login, from a browser. Restrict that by adding your office
    # address to the allow list below and uncommenting.
    location /admin/ {
        # allow 203.0.113.0/24;   # office
        # allow 127.0.0.1;
        # deny all;
        include /etc/nginx/snippets/law-agent-proxy-backend.conf;
    }

    location / {
        include /etc/nginx/snippets/law-agent-proxy-backend.conf;
    }
}
