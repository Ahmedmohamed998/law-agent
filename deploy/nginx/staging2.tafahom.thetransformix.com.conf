# AI service (Python/FastAPI) — retrieval, conversations, streaming.
#
#   staging2.tafahom.thetransformix.com  ->  127.0.0.1:8000
#
# THIS VHOST STREAMS. Generation takes 8–17 seconds and is delivered as
# text/event-stream. nginx buffers that content type by default, which holds
# the entire answer and delivers it in one lump at the end — the page looks
# frozen, then fills instantly. It works on a laptop with no proxy in front
# and fails the moment one appears, which is why the buffering settings below
# are the point of this file rather than a detail in it.
#
# The service already sends `X-Accel-Buffering: no`. That is one half of the
# fix; `proxy_buffering off` is the other.
#
# Install:
#   cp deploy/nginx/staging2.tafahom.thetransformix.com.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/staging2.tafahom.thetransformix.com.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name staging2.tafahom.thetransformix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging2.tafahom.thetransformix.com;

    ssl_certificate     /etc/letsencrypt/live/staging2.tafahom.thetransformix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging2.tafahom.thetransformix.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Conversations contain dismissals, wage disputes and salary details.
    # Nothing on this host is cacheable by anything.
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/law-agent-ai.access.log;
    error_log  /var/log/nginx/law-agent-ai.error.log;

    client_max_body_size 256k;

    # CORS is the application's, as it is on the backend. Do not add
    # Access-Control-* headers here.

    # ── health checks ────────────────────────────────────────────────────
    # Point the monitor at /readyz, not /healthz. Ready means the retrieval
    # index is loaded AND the pool hands out a connection; liveness alone
    # will happily route traffic at a process that cannot answer.
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ── the streaming endpoint ───────────────────────────────────────────
    # Matches /v1/sessions/<id>/messages/stream.
    location ~ ^/v1/sessions/[^/]+/messages/stream$ {
        limit_req zone=law_agent_chat burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;

        # The four lines this whole file exists for.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Generation runs to ~17s and the client is idle while it waits.
        # A 60s default read timeout cuts long answers off mid-sentence.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Belt and braces: the service sends this itself, but a repeat here
        # survives someone rewriting response headers upstream.
        proxy_set_header X-Accel-Buffering no;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── service-to-service ───────────────────────────────────────────────
    # /v1/users/{id}/data (erasure) and /v1/admin/* authenticate with
    # X-Admin-Key and are called by the product backend, not by a browser.
    # If both services share a host, block them from the internet entirely.
    # ── voice upload ─────────────────────────────────────────────────────
    # The only route that takes more than 256k. A 60-second recording is
    # ~1.9 MB of 16 kHz PCM; 3m allows for the header and nothing more, so the
    # larger limit cannot be used to push big bodies at any other endpoint.
    # Its own rate zone, because each call is a paid Transcribe request.
    location = /v1/transcribe {
        limit_req zone=law_agent_voice burst=5 nodelay;
        client_max_body_size 3m;
        include /etc/nginx/snippets/law-agent-proxy-ai.conf;
    }

    location /v1/admin/ {
        # allow 127.0.0.1;
        # deny all;
        include /etc/nginx/snippets/law-agent-proxy-ai.conf;
    }

    # ── everything else ──────────────────────────────────────────────────
    # Session CRUD, history, feedback, the non-streaming message endpoint.
    # The blocking POST /messages can also take ~17s, so this timeout is
    # generous too.
    location / {
        limit_req zone=law_agent_chat burst=20 nodelay;
        include /etc/nginx/snippets/law-agent-proxy-ai.conf;
    }
}
