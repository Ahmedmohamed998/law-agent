# Shared proxy settings for the product backend.
#
#   cp deploy/nginx/snippets-law-agent-proxy-backend.conf \
#      /etc/nginx/snippets/law-agent-proxy-backend.conf
#
# In its own file because several location blocks need identical settings and
# a drifted copy is the kind of bug that only shows up on one endpoint.

proxy_pass http://127.0.0.1:8001;

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
