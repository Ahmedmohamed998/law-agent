# Admin dashboard — static build of dashboard/dist.
#
#   dashboard.tafahom.thetransformix.com  ->  /srv/law-agent/dashboard/dist
#
# No proxy_pass: the bundle is served straight from disk and talks to the
# backend from the browser, cross-origin, with the operator's own token. So
# the backend's CORS_ORIGIN_REGEX has to allow this host as well as the
# WordPress one.
#
# THIS PAGE SHOWS REVENUE AND CLIENT EMAIL ADDRESSES. The role check in the
# token is authorization, not a reason to leave it open to the internet —
# uncomment the allow/deny block below with your office address.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.tafahom.thetransformix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.tafahom.thetransformix.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.tafahom.thetransformix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.tafahom.thetransformix.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    root /srv/law-agent/dashboard/dist;
    index index.html;

    access_log /var/log/nginx/law-agent-dashboard.access.log;
    error_log  /var/log/nginx/law-agent-dashboard.error.log;

    # ── restrict by source address ───────────────────────────────────────
    # allow 203.0.113.0/24;   # office
    # deny  all;

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is what points at the current bundle,
    # and a stale copy pins everyone to a build that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
