# Rate limit zones for the Law Agent services.
#
# These MUST live in the http{} context, not inside a server block —
# limit_req_zone is invalid there and nginx will refuse to start. Drop this
# file in /etc/nginx/conf.d/, which is included from http{} by default. The
# 00- prefix keeps it ahead of the vhosts that reference the zones.
#
#   cp deploy/nginx/00-law-agent-limits.conf /etc/nginx/conf.d/
#
# Why these exist at all: embedding the chat widget on a public WordPress page
# turns /auth/login and /auth/anonymous into internet-facing endpoints. Neither
# is throttled in application code, and one of them creates a database row on
# every call.

# Password guessing. Real people log in a handful of times a day; anything
# faster is a script.
limit_req_zone $binary_remote_addr zone=law_agent_login:10m rate=5r/m;

# Anonymous token minting. One per visitor per session in normal use — the
# widget reuses the token it already has. A burst above this is someone
# creating user rows in a loop.
limit_req_zone $binary_remote_addr zone=law_agent_anon:10m rate=20r/m;

# Registration. nginx accepts only r/s and r/m — there is no r/h — so the
# intended "a handful an hour" is expressed as a low sustained rate with a
# burst, which is what the burst parameter on the location is for.
limit_req_zone $binary_remote_addr zone=law_agent_signup:10m rate=1r/m;

# General ceiling on the chat service. Deliberately loose: this is a backstop
# against a stuck client, not a usage policy. Per-user limits on generation
# belong in the application, where the caller's identity is known — an IP is a
# poor proxy for a person behind a corporate NAT or a mobile carrier.
limit_req_zone $binary_remote_addr zone=law_agent_chat:10m rate=60r/m;

# 429, not 503. A client that retries on 503 forever is a client that thinks
# the service is broken rather than that it is going too fast.
limit_req_status 429;
limit_req_log_level warn;
