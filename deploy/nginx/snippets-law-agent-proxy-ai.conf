# Shared proxy settings for the AI service's non-streaming routes.
#
#   cp deploy/nginx/snippets-law-agent-proxy-ai.conf \
#      /etc/nginx/snippets/law-agent-proxy-ai.conf
#
# Buffering is left off here too. The blocking POST /v1/sessions/{id}/messages
# takes as long as the streaming one, and there is nothing on this service
# whose response is worth holding in nginx.

proxy_pass http://127.0.0.1:8000;

proxy_buffering off;
proxy_cache off;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout    180s;
proxy_read_timeout    180s;
