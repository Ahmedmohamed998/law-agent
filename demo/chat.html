<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Law Agent — demo client</title>
<style>
  :root {
    --bg: #f3f5f6; --panel: #fff; --ink: #16202a; --muted: #64757f;
    --rule: #dde4e8; --accent: #0e6b47; --accent-soft: #e8f2ed;
    --warn: #96560a; --warn-soft: #fbf1e2;
    --mono: ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151a; --panel: #171e24; --ink: #e6ecef; --muted: #93a3ad;
      --rule: #27313a; --accent: #4cbc8d; --accent-soft: #12291f;
      --warn: #d8a055; --warn-soft: #2a2110;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 290px 1fr;
    background: var(--bg); color: var(--ink);
    font: 15px/1.65 system-ui, "Segoe UI", "Noto Naskh Arabic", sans-serif;
  }
  /* ── sidebar ── */
  aside { background: var(--panel); border-inline-start: 1px solid var(--rule);
          display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
  aside h1 { font-size: 15px; margin: 0 0 10px; }
  #who { width: 100%; padding: 7px 9px; font: 12px var(--mono);
         border: 1px solid var(--rule); border-radius: 6px;
         background: var(--bg); color: var(--ink); }
  #new { margin: 12px 16px; padding: 9px; border: 0; border-radius: 7px;
         background: var(--accent); color: #fff; font: inherit; font-weight: 600;
         cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
  .item { padding: 9px 11px; border-radius: 7px; cursor: pointer;
          font-size: 13.5px; color: var(--muted); border: 1px solid transparent; }
  .item:hover { background: var(--bg); }
  .item.on { background: var(--accent-soft); color: var(--ink);
             border-color: var(--accent); }
  .item small { display: block; font: 10px var(--mono); opacity: .65;
                margin-top: 3px; direction: ltr; text-align: right; }
  /* ── chat ── */
  main { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 26px 30px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 22px; }
  .role { font: 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase;
          color: var(--muted); margin-bottom: 5px; }
  .bubble { background: var(--panel); border: 1px solid var(--rule);
            border-radius: 10px; padding: 13px 16px; }
  .user .bubble { background: var(--accent-soft); border-color: var(--accent); }
  /* markdown, matching what the Gradio harness renders */
  .md p { margin: 0 0 10px; }
  .md p:last-child { margin-bottom: 0; }
  .md ul { margin: 0 0 10px; padding-inline-start: 22px; }
  .md li { margin-bottom: 4px; }
  .md strong { font-weight: 700; }
  .md code { font: .87em var(--mono); background: var(--bg);
             border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
  .md table { border-collapse: collapse; width: 100%; margin: 10px 0;
              font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--rule); padding: 6px 10px;
                   text-align: right; }
  .md th { background: var(--bg); font-weight: 650; }
  .md .tbl { overflow-x: auto; }
  .badge { display: inline-block; font: 10.5px var(--mono); padding: 2px 8px;
           border-radius: 20px; margin-inline-start: 8px; vertical-align: 2px; }
  .b-documents { background: var(--accent-soft); color: var(--accent); }
  .b-mixed, .b-model_knowledge, .b-refused {
           background: var(--warn-soft); color: var(--warn); }
  /* collapsed by default, like the <details> block the Gradio harness emits */
  .cites { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule);
           font-size: 13px; color: var(--muted); }
  .cites summary { cursor: pointer; color: var(--ink); font-weight: 600;
                   list-style: none; }
  .cites summary::-webkit-details-marker { display: none; }
  .cites summary::before { content: "▸ "; color: var(--muted); }
  .cites[open] summary::before { content: "▾ "; }
  .cites ul { margin: 9px 0 0; padding-inline-start: 20px; }
  .cites li { margin-bottom: 5px; }
  .cites b { color: var(--ink); }
  /* ── composer ── */
  form { border-top: 1px solid var(--rule); background: var(--panel);
         padding: 14px 30px; display: flex; gap: 10px;
         max-width: 820px; margin: 0 auto; width: 100%; }
  textarea { flex: 1; resize: none; padding: 11px 13px; border-radius: 8px;
             border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
             font: inherit; }
  button[type=submit] { padding: 0 22px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; font: inherit;
             font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  #trace { border-top: 1px solid var(--rule); background: var(--panel);
           font: 11px var(--mono); color: var(--muted); direction: ltr;
           text-align: left; padding: 8px 14px; max-height: 132px;
           overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<aside>
  <header>
    <h1>Law Agent — demo client</h1>
    <input id="who" value="u_ahmed" title="dev bearer token = user id">
  </header>
  <button id="new">+ محادثة جديدة</button>
  <div id="list"></div>
</aside>

<main>
  <div id="log"><div class="wrap" id="thread"></div></div>
  <form id="composer">
    <textarea id="input" rows="2" placeholder="اكتب سؤالك…"></textarea>
    <button type="submit" id="send">إرسال</button>
  </form>
  <div id="trace">SSE trace —</div>
</main>

<script>
const API = "http://127.0.0.1:8000";
let sessionId = new URLSearchParams(location.search).get("s");

const $ = id => document.getElementById(id);
const user = () => $("who").value.trim() || "u_ahmed";
const hdrs = () => ({ "Authorization": "Bearer " + user(),
                      "Content-Type": "application/json" });

function trace(line) {
  $("trace").textContent += "\n" + line;
  $("trace").scrollTop = $("trace").scrollHeight;
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: hdrs(), ...opts });
  if (r.status === 204) return null;
  const body = await r.json();
  if (!r.ok) throw new Error(body?.error?.code || JSON.stringify(body));
  return body;
}

// ── sidebar ────────────────────────────────────────────────────────────
async function loadSessions() {
  const rows = await api("/v1/sessions");
  $("list").innerHTML = "";
  for (const s of rows) {
    const el = document.createElement("div");
    el.className = "item" + (s.session_id === sessionId ? " on" : "");
    el.innerHTML = `${(s.title || "بدون عنوان").slice(0, 46)}
      <small>${s.session_id.slice(0, 12)}… · ${s.status}</small>`;
    el.onclick = () => open(s.session_id);
    $("list").appendChild(el);
  }
  trace(`GET /v1/sessions -> ${rows.length} session(s)`);
}

async function open(id) {
  sessionId = id;
  history.replaceState(null, "", "?s=" + id);
  const msgs = await api(`/v1/sessions/${id}/messages`);
  $("thread").innerHTML = "";
  msgs.forEach(m => {            // already ordered by seq, server-side
    const el = render({ ...m, sources: [] });
    if (m.sources?.length) addCites(el, m.sources);
  });
  trace(`GET /v1/sessions/${id.slice(0,8)}…/messages -> ${msgs.length} messages`);
  loadSessions();
}

// ── markdown ───────────────────────────────────────────────────────────
// Small on purpose: bold, italic, inline code, bullets and tables are what the
// answers actually contain (penalty schedules come back as real tables).
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function markdown(src) {
  const lines = (src || "").split("\n");
  const out = [];
  let list = null, para = [];

  const flushPara = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
  };
  const flushList = () => { if (list) { out.push(`<ul>${list}</ul>`); list = null; } };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // table: a header row followed by |---|---|
    if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      flushPara(); flushList();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(line);
      let body = "";
      i += 2;
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
        body += "<tr>" + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      }
      i--;
      out.push(`<div class="tbl"><table><thead><tr>` +
        head.map(c => `<th>${inline(c)}</th>`).join("") +
        `</tr></thead><tbody>${body}</tbody></table></div>`);
      continue;
    }

    const bullet = line.match(/^\s*[-*·]\s+(.*)$/);
    if (bullet) { flushPara(); list = (list || "") + `<li>${inline(bullet[1])}</li>`; continue; }

    if (!line.trim()) { flushPara(); flushList(); continue; }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join("");
}

// ── rendering ──────────────────────────────────────────────────────────
// Mirrors what app/ui.py emits, so the API client and the Gradio harness read
// the same way: rendered Markdown, then a collapsed sources block.
const REASON_LABEL = {
  article_lookup:   "🎯 مطابقة رقم المادة",
  hybrid:           "⭐ دلالي + لفظي",
  semantic:         "🧠 بحث دلالي",
  lexical:          "🔤 بحث لفظي",
  regulation_join:  "🔗 ربط النظام باللائحة",
};

function render(m) {
  const el = document.createElement("div");
  el.className = "msg " + m.role;
  const badge = m.source_label
    ? `<span class="badge b-${m.source_label}">${m.source_label}</span>` : "";
  el.innerHTML = `<div class="role">${m.role} · seq ${m.seq}${badge}</div>
                  <div class="bubble"><div class="md"></div></div>`;
  const md = el.querySelector(".md");
  if (m.role === "user") md.textContent = m.content;
  else md.innerHTML = markdown(m.content);
  if (m.sources?.length) addCites(el, m.sources);
  
  if (m.source_label === "escalate") {
    const btn = document.createElement("button");
    btn.textContent = "حجز استشارة مدفوعة 💳 (500 SAR)";
    btn.style.marginTop = "10px";
    btn.style.backgroundColor = "var(--primary)";
    btn.style.color = "white";
    btn.onclick = () => bookConsultation();
    md.appendChild(btn);
  }
  
  $("thread").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

async function bookConsultation() {
  const NODE_API = "http://127.0.0.1:8001";
  try {
    // 1. Sign up a dummy user to get a real JWT
    const signupRes = await fetch(NODE_API + "/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: "demo_" + Date.now() + "@lawagent.local",
        password: "Password123!",
        display_name: "Demo User"
      })
    });
    if (!signupRes.ok) throw new Error("Failed to sign up demo user");
    const { access_token } = await signupRes.json();

    // 2. Buy consultation
    const consultRes = await fetch(NODE_API + "/consultations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + access_token
      },
      body: JSON.stringify({
        ai_session_id: sessionId,
        amount_cents: 50000,
        currency: "SAR",
        full_name: "Demo User",
        phone: "+201000000000"
      })
    });
    if (!consultRes.ok) throw new Error(await consultRes.text());
    const { payment_key } = await consultRes.json();

    // 3. Redirect to Paymob iframe
    window.location.href = "https://ksa.paymob.com/api/acceptance/iframes/13464?payment_token=" + payment_key;
  } catch (e) {
    alert("Error booking consultation: " + e.message);
  }
}

function addCites(el, sources, seconds) {
  el.querySelector(".cites")?.remove();
  const box = document.createElement("details");
  box.className = "cites";
  const secs = seconds ? ` — ${seconds.toFixed(1)}s` : "";
  box.innerHTML = `<summary>📚 المصادر (${sources.length})${secs}</summary>
    <ul>${sources.map(s =>
      `<li><b>${esc(s.citation)}</b> · ${REASON_LABEL[s.reason] || esc(s.reason)}</li>`
    ).join("")}</ul>`;
  el.querySelector(".bubble").appendChild(box);
}

// ── sending, over SSE ──────────────────────────────────────────────────
async function send(text) {
  if (!sessionId) {
    const s = await api("/v1/sessions", { method: "POST",
      body: JSON.stringify({ lang: "ar" }) });
    sessionId = s.session_id;
    history.replaceState(null, "", "?s=" + sessionId);
    trace(`POST /v1/sessions -> ${sessionId}`);
  }

  render({ role: "user", seq: "—", content: text, sources: [] });

  // One id per user action, reused across retries. Regenerating it on retry
  // is what defeats idempotency.
  const clientMessageId = crypto.randomUUID();
  const bubble = render({ role: "assistant", seq: "…", content: "", sources: [] });
  const target = bubble.querySelector(".md");
  target.textContent = "⏳ جارٍ البحث في المستندات...";
  const state = { raw: "", started: performance.now(), lastPaint: 0, sources: [] };

  const r = await fetch(`${API}/v1/sessions/${sessionId}/messages/stream`, {
    method: "POST", headers: hdrs(),
    body: JSON.stringify({ content: text, client_message_id: clientMessageId }),
  });

  const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "", event = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const frames = buf.split("\n\n");
    buf = frames.pop();
    for (const frame of frames) {
      for (const line of frame.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: "))
          handle(event, JSON.parse(line.slice(6)), bubble, target, state);
      }
    }
  }
  loadSessions();
}

function handle(event, data, bubble, target, state) {
  if (event === "token") {
    state.raw += data.delta;               // append the tail, never replace
    const now = performance.now();
    // Repaint a few times a second, as app/ui.py does. Re-rendering Markdown
    // on every token makes the browser the bottleneck, not the model.
    if (now - state.lastPaint > 150) {
      state.lastPaint = now;
      target.innerHTML = markdown(state.raw);
      $("log").scrollTop = $("log").scrollHeight;
    }
    return;
  }
  trace(`  event: ${event}  ${JSON.stringify(data).slice(0, 150)}`);
  if (event === "meta") {
    bubble.querySelector(".role").textContent = `assistant · seq ${data.seq}`;
  } else if (event === "sources") {
    state.sources = data.sources;          // held until `done`, like the harness
  } else if (event === "done") {
    target.innerHTML = markdown(state.raw);
    addCites(bubble, state.sources, (performance.now() - state.started) / 1000);
    bubble.querySelector(".role").innerHTML +=
      ` <span class="badge b-${data.source_label}">${data.source_label}</span>`;
      
    if (data.source_label === "escalate") {
      const btn = document.createElement("button");
      btn.textContent = "حجز استشارة مدفوعة 💳 (500 SAR)";
      btn.style.marginTop = "10px";
      btn.style.backgroundColor = "var(--primary)";
      btn.style.color = "white";
      btn.onclick = () => bookConsultation();
      target.appendChild(btn);
    }
    
    $("log").scrollTop = $("log").scrollHeight;
  } else if (event === "error") {
    target.innerHTML = markdown(state.raw) +
      `<p>⚠️ <b>${esc(data.code)}</b> — ${esc(data.message)}</p>`;
  }
}

// ── wiring ─────────────────────────────────────────────────────────────
$("composer").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  try { await send(text); }
  catch (err) { trace("ERROR " + err.message); }
  finally { $("send").disabled = false; }
};
$("input").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
};
$("new").onclick = () => {
  // Created lazily on the first message, so an abandoned chat never exists.
  sessionId = null;
  history.replaceState(null, "", location.pathname);
  $("thread").innerHTML = "";
  loadSessions();
};
$("who").onchange = () => { sessionId = null; $("thread").innerHTML = ""; loadSessions(); };

(async () => {
  await loadSessions();
  if (sessionId) open(sessionId);
})();
</script>
</body>
</html>
