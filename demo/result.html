<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتيجة الدفع</title>
  <style>
    :root {
      --primary: #1a202c;
      --success: #10b981;
      --error: #ef4444;
      --bg: #f8fafc;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .success .icon { color: var(--success); }
    .error .icon { color: var(--error); }
    h1 {
      margin: 0 0 10px 0;
      color: var(--primary);
      font-size: 24px;
    }
    p {
      color: #64748b;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card" id="result-card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">جاري التحقق...</h1>
    <p id="message">يرجى الانتظار بينما نتحقق من حالة الدفع.</p>
    <a href="/chat.html" class="btn">العودة للمحادثة</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const success = urlParams.get('success');
    const card = document.getElementById('result-card');
    
    if (success === 'true') {
      card.className = 'card success';
      document.getElementById('icon').textContent = '✅';
      document.getElementById('title').textContent = 'تم الدفع بنجاح!';
      document.getElementById('message').textContent = 'تم حجز الاستشارة بنجاح. سيتم تحويلك إلى المحامي قريباً.';
    } else if (success === 'false') {
      card.className = 'card error';
      document.getElementById('icon').textContent = '❌';
      document.getElementById('title').textContent = 'فشلت عملية الدفع';
      document.getElementById('message').textContent = 'عذراً، لم نتمكن من إتمام عملية الدفع. يرجى المحاولة مرة أخرى.';
    }
  </script>
</body>
</html>
