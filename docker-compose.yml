# The whole stack: Postgres, the product backend, the AI service.
#
# nginx is NOT here. It runs natively on the host and proxies to the two
# published ports below — which is why both are bound to 127.0.0.1 rather
# than 0.0.0.0. Publishing them on all interfaces would put an unencrypted
# API on the public internet beside the TLS one.
#
#   docker compose up -d --build
#   docker compose logs -f ai
#
# First-time setup is in deploy/README.md.

name: law-agent

services:

  # ── database ────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: law_agent
      # Superuser password. The application roles created by
      # sql/bootstrap.sql have their own, and neither service ever connects
      # as this one.
      # Compose interpolates this from ./.env, which it reads automatically.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: exposed so you can run psql on the host, not so the
      # internet can. Remove this line entirely once you no longer need it.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d law_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [law-agent]

  # ── product backend ─────────────────────────────────────────────────────
  # Started before the AI service because it publishes the JWKS document the
  # AI service verifies every token against.
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Inside a container 127.0.0.1 is the container's own loopback and
      # nothing — not even the host — can reach it. Privacy comes from the
      # 127.0.0.1 published port below instead.
      BIND_HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # The private signing key, generated once with `npm run keygen` and
      # never baked into an image. Back this directory up separately: losing
      # it invalidates every refresh token in circulation.
      - ./backend/keys:/app/keys
    networks: [law-agent]

  # ── AI service ──────────────────────────────────────────────────────────
  ai:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BIND_HOST: 0.0.0.0
      BIND_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Not image content: the Chroma index is 79MB, Chroma opens it
      # read-write even to query it, and re-ingesting documents should not
      # mean rebuilding an image.
      - ./data:/app/data
    networks: [law-agent]

  # ── operator tools ──────────────────────────────────────────────────────
  # Never runs as a service. This is the build stage, which still has the
  # TypeScript sources and the dev dependencies that `keygen`, `kid:check`,
  # `db:check` and `webhook:simulate` need — none of which exist in the
  # runtime image, and none of which should.
  #
  #   docker compose run --rm tools npm run keygen
  #   docker compose run --rm tools npm run kid:check
  #
  tools:
    build:
      context: ./backend
      target: build
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/keys:/app/keys
    networks: [law-agent]
    command: ["npm", "run", "kid:check"]

volumes:
  pgdata:

networks:
  law-agent:
    driver: bridge
